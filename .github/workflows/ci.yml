name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Read Go version
        id: go-version
        run: echo "version=$(awk '/^go / { print $2; exit }' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Image timestamp
        id: image-timestamp
        run: echo "tag=$(date -u +'%Y%m%dt%H%M%Sz')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ramondeklein
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: GO_VERSION=${{ steps.go-version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ramondeklein/lt200b:latest
            ramondeklein/lt200b:${{ github.sha }}
            ramondeklein/lt200b:${{ steps.image-timestamp.outputs.tag }}
